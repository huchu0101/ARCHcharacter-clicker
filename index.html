<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ARCH Character Clicker - Mobile Optimized</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --main-text: #2d3436;
            --light-gray: #f5f6fa;
            --sidebar-width: 300px; /* 모바일을 위해 살짝 조정 */
            --theme-color: #0984e3; 
        }

        /* 전체 모바일 터치 최적화 */
        * {
            -webkit-tap-highlight-color: transparent; /* 터치 시 파란 박스 제거 */
            touch-action: manipulation; /* 더블 탭 줌 방지 */
            user-select: none; /* 텍스트 선택 방지 */
            -webkit-user-select: none;
        }

        body { 
            margin: 0; background: var(--bg-color); color: var(--main-text); 
            font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; 
            overflow: hidden; transition: background-color 0.3s; position: relative; 
        }

        header { 
            position: fixed; top: 0; left: 0; right: 0; height: 60px; padding: 0 20px; 
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); z-index: 100; 
        }
        
        #menu-toggle { background: none; border: none; font-size: 28px; cursor: pointer; color: var(--main-text); }
        
        main { 
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; margin-top: 40px; position: relative; z-index: 10;
            padding: 20px;
        }
        
        .badge-container { display: flex; gap: 8px; margin-bottom: 10px; }
        .level-badge, .attr-badge { padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; transition: all 0.3s ease; }
        .level-badge { background: var(--theme-color); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .attr-badge { background: white; color: var(--theme-color); border: 2px solid var(--theme-color); }
        
        .name-tag { font-size: 1.4rem; font-weight: 800; margin-bottom: 15px; }
        
        /* 캐릭터 이미지 크기를 모바일 화면에 맞춤 */
        #char-display { 
            width: 80vw; max-width: 300px; aspect-ratio: 1/1; 
            border-radius: 35px; object-fit: cover; background: var(--light-gray); 
            cursor: pointer; transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            -webkit-user-drag: none; border: 3px solid transparent; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        #char-display:active { transform: scale(0.95); filter: brightness(1.1); }
        
        /* 게이지 모바일 최적화 */
        .gauge-outer { width: 85vw; max-width: 350px; height: 12px; background: #eee; border-radius: 6px; overflow: hidden; margin: 25px 0 10px; }
        #gauge-inner { width: 0%; height: 100%; background: var(--theme-color); transition: width 0.1s ease-out; }
        .info-text { font-size: 1rem; font-weight: bold; color: #636e72; }

        /* 사이드바 모바일 대응 */
        #sidebar { 
            position: fixed; top: 0; right: -100%; width: 85%; max-width: var(--sidebar-width); 
            height: 100vh; background: #ffffff; box-shadow: -5px 0 25px rgba(0,0,0,0.1); 
            transition: 0.3s ease-in-out; z-index: 200; padding: 20px; 
            box-sizing: border-box; display: flex; flex-direction: column; 
        }
        #sidebar.open { right: 0; }
        #character-list { flex: 1; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }
        
        /* 하단 설정 영역 */
        .sound-setting-area { border-top: 1px solid #eee; padding-top: 15px; margin-bottom: 15px; }
        .sound-title { font-size: 0.85rem; font-weight: bold; color: #888; margin-bottom: 10px; display: block; }
        .sound-btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .sound-btn { padding: 8px 3px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 0.7rem; font-weight: bold; }
        .sound-btn.active { background: var(--main-text); color: #fff; }

        .reset-area { border-top: 1px solid #eee; padding-top: 10px; padding-bottom: 20px;}
        .reset-btn { width: 100%; padding: 12px; background: #ff7675; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 0.8rem; }

        .group-name { font-weight: bold; color: #888; margin: 20px 0 8px; font-size: 0.85rem; border-bottom: 1px solid #eee; padding-bottom: 3px;}
        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .char-icon img { width: 100%; aspect-ratio: 1/1; border-radius: 12px; background: var(--light-gray); object-fit: cover; }
        .char-label { font-size: 0.65rem; margin-top: 4px; color: #555; font-weight: bold; text-align: center;}

        /* 진화 이펙트 모바일용 크기 조정 */
        #evolution-effect {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999;
            display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
        }
        .evo-text {
            font-size: 2.5rem; font-weight: 900; color: #f1c40f; letter-spacing: 3px;
            text-shadow: 0 0 15px #f39c12; font-style: italic;
        }
        .evo-active { opacity: 1 !important; }
        .evo-active .evo-text { animation: evoAnim 2.5s forwards; }

        .creator-tag { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: #bdc3c7; font-size: 0.75rem; pointer-events: none; }
        
        @keyframes evoAnim {
            0% { transform: scale(0.5); opacity: 0; }
            20% { transform: scale(1.1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="evolution-effect">
        <div class="evo-text">EVOLUTION!</div>
    </div>

    <header>
        <h2 style="font-size: 1rem; letter-spacing: 1px;">ARCH 클리커</h2>
        <button id="menu-toggle">☰</button>
    </header>

    <main>
        <div class="badge-container">
            <div class="attr-badge" id="attr-display">무속성</div>
            <div class="level-badge" id="lv-display">LV. 1</div>
        </div>
        <div class="name-tag" id="target-name">캐릭터를 선택하세요</div>
        <img id="char-display" src="https://via.placeholder.com/300?text=Select+Character" alt="Character">
        <div class="gauge-outer">
            <div id="gauge-inner"></div>
        </div>
        <div class="info-text">EXP: <span id="exp-text">0</span> / <span id="max-exp-text">100</span></div>
    </main>

    <div class="creator-tag">@huchu0101</div>

    <aside id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>도감</h3>
            <button onclick="toggleSidebar()" style="background:none; border:none; cursor:pointer; font-size:24px;">✕</button>
        </div>
        
        <div id="character-list"></div>

        <div class="sound-setting-area">
            <span class="sound-title">🎵 클릭 소리</span>
            <div class="sound-btn-grid">
                <button class="sound-btn" onclick="changeSound('blue', this)">청축</button>
                <button class="sound-btn" onclick="changeSound('red', this)">적축</button>
                <button class="sound-btn" onclick="changeSound('brown', this)">갈축</button>
                <button class="sound-btn" onclick="changeSound('silver', this)">은축</button>
                <button class="sound-btn" onclick="changeSound('mint', this)">민트축</button>
                <button class="sound-btn" onclick="changeSound('slap', this)">뺨</button>
                <button class="sound-btn" onclick="changeSound('hit', this)">타격</button>
            </div>
        </div>

        <div class="reset-area">
            <button class="reset-btn" onclick="resetLevel()">🔄 레벨 초기화</button>
        </div>
    </aside>

    <script>
        const soundMap = {
            'blue': 'blue.mp3', 'red': 'red.mp3', 'brown': 'brown.mp3', 
            'silver': 'silver.mp3', 'mint': 'mint.mp3', 'slap': 'slap.mp3', 'hit': 'hit.mp3'
        };

        const attrColors = {
            "바람": "#41f2cf", "불": "#e74c3c", "물": "#3498db", "풀": "#2ecc71",
            "번개": "#f39c12", "얼음": "#baefff", "무속성": "#b2bec3" 
        };

        const charData = {
            "ARCH-PRIMA": [
                { name: "해일", attr: "물", img: "hail.png", evolve: { 50: "hail_lv50.png", 100: "hail_lv100.png" } },
                { name: "이카로스", attr: "바람", img: "icarus.png", evolve: { 50: "icarus_lv50.png", 100: "icarus_lv100.png" } },
                { name: "산타", attr: "얼음", img: "santa.png", evolve: { 50: "santa_lv50.png", 100: "santa_lv100.png" } },
                { name: "헬리오스", attr: "불", img: "helios.png", evolve: { 50: "helios_lv50.png", 100: "helios_lv100.png" } }
            ],
            "VANGUARD 1팀": [
                { name: "애쉬", attr: "불", img: "ash.png", evolve: { 50: "ash_lv50.png", 100: "ash_lv100.png" } },
                { name: "셰인", attr: "바람", img: "shane.png", evolve: { 50: "shane_lv50.png", 100: "shane_lv100.png" } },
                { name: "오버로드", attr: "번개", img: "overlord.png", evolve: { 50: "overlord_lv50.png", 100: "overlord_lv100.png" } },
                { name: "노아", attr: "물", img: "noah.png", evolve: { 50: "noah_lv50.png", 100: "noah_lv100.png" } },
                { name: "아모레", attr: "풀", img: "amore.png", evolve: { 50: "amore_lv50.png", 100: "amore_lv100.png" } },
                { name: "라임", attr: "얼음", img: "lime.png", evolve: { 50: "lime_lv50.png", 100: "lime_lv100.png" } }
            ],
            "VANGUARD 2팀": [
                { name: "신드롬", attr: "불", img: "syndrome.png", evolve: { 50: "syndrome_lv50.png", 100: "syndrome_lv100.png" } },
                { name: "리암", attr: "얼음", img: "liam.png", evolve: { 50: "liam_lv50.png", 100: "liam_lv100.png" } },
                { name: "바이브", attr: "바람", img: "vibe.png", evolve: { 50: "vibe_lv50.png", 100: "vibe_lv100.png" } }
            ],
            "AGENT": [
                { name: "샤드", attr: "얼음", img: "shard.png", evolve: { 50: "shard_lv50.png", 100: "shard_lv100.png" } },
                { name: "카토", attr: "풀", img: "kato.png", evolve: { 50: "kato_lv50.png", 100: "kato_lv100.png" } },
                { name: "루비", attr: "불", img: "ruby.png", evolve: { 50: "ruby_lv50.png", 100: "ruby_lv100.png" } }
            ],
            "ACOLYTE": [
                { name: "피카", attr: "번개", img: "pika.png", evolve: { 50: "pika_lv50.png", 100: "pika_lv100.png" } },
                { name: "블루", attr: "물", img: "blue.png", evolve: { 50: "blue_lv50.png", 100: "blue_lv100.png" } }
            ],
            "HARMONY DIV.": [
                { name: "윈터", attr: "얼음", img: "winter.png", evolve: { 50: "winter_lv50.png", 100: "winter_lv100.png" } },
                { name: "오아시스", attr: "물", img: "oasis.png", evolve: { 50: "oasis_lv50.png", 100: "oasis_lv100.png" } },
                { name: "자이안", attr: "풀", img: "zian.png", evolve: { 50: "zian_lv50.png", 100: "zian_lv100.png" } },
                { name: "스트레이", attr: "번개", img: "stray.png", evolve: { 50: "stray_lv50.png", 100: "stray_lv100.png" } }
            ],
            "R.S.T": [
                { name: "에덴", attr: "바람", img: "eden.png", evolve: { 50: "eden_lv50.png", 100: "eden_lv100.png" } },
                { name: "휴고", attr: "불", img: "hugo.png", evolve: { 50: "hugo_lv50.png", 100: "hugo_lv100.png" } },
                { name: "카르마", attr: "번개", img: "karma.png", evolve: { 50: "karma_lv50.png", 100: "karma_lv100.png" } }, 
                { name: "저스티스", attr: "물", img: "justice.png", evolve: { 50: "justice_lv50.png", 100: "justice_lv100.png" } }
            ],
            "CORE": [
                { name: "퓨어", attr: "무속성", img: "pure.png", evolve: { 50: "pure_lv50.png", 100: "pure_lv100.png" } },
                { name: "밴스", attr: "풀", img: "vance.png", evolve: { 50: "vance_lv50.png", 100: "vance_lv100.png" } }
            ]
        };

        let currentExp = 0, currentMaxExp = 100, level = 1;
        let currentCharObj = null; 
        let selectedSound = localStorage.getItem('click_sound_type') || 'blue';

        const sidebar = document.getElementById('sidebar');
        const charList = document.getElementById('character-list');
        const displayImg = document.getElementById('char-display');
        const targetName = document.getElementById('target-name');
        const lvDisplay = document.getElementById('lv-display');
        const attrDisplay = document.getElementById('attr-display');
        const gauge = document.getElementById('gauge-inner');
        const expText = document.getElementById('exp-text');
        const maxExpText = document.getElementById('max-exp-text');

        Object.keys(charData).forEach(groupName => {
            const wrap = document.createElement('div');
            wrap.innerHTML = `<div class="group-name">${groupName}</div>`;
            const grid = document.createElement('div');
            grid.className = 'char-grid';
            charData[groupName].forEach((char, index) => {
                const item = document.createElement('div');
                item.className = 'char-icon';
                const imgSrc = char.img ? char.img : `https://via.placeholder.com/80?text=${char.name.substring(0,2)}`;
                item.innerHTML = `<img src="${imgSrc}" onclick="loadChar('${groupName}', ${index})"><div class="char-label">${char.name}</div>`;
                grid.appendChild(item);
            });
            wrap.appendChild(grid);
            charList.appendChild(wrap);
        });

        function changeSound(type, btnElement) {
            selectedSound = type;
            localStorage.setItem('click_sound_type', type);
            document.querySelectorAll('.sound-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
        }
        changeSound(selectedSound);

        function toggleSidebar() { sidebar.classList.toggle('open'); }
        document.getElementById('menu-toggle').onclick = toggleSidebar;

        function loadChar(groupName, index) {
            currentCharObj = charData[groupName][index];
            const themeColor = attrColors[currentCharObj.attr] || attrColors["무속성"];
            document.documentElement.style.setProperty('--theme-color', themeColor);
            targetName.innerText = currentCharObj.name;
            attrDisplay.innerText = currentCharObj.attr;
            const savedData = JSON.parse(localStorage.getItem('arch_clicker_' + currentCharObj.name)) || { level: 1, exp: 0, maxExp: 100 };
            level = savedData.level; currentExp = savedData.exp; currentMaxExp = savedData.maxExp;
            updateUI(); updateCharacterImage(); toggleSidebar();
        }

        function updateCharacterImage() {
            if (!currentCharObj) return;
            let currentImg = currentCharObj.img || `https://via.placeholder.com/300?text=${currentCharObj.name}`;
            if (currentCharObj.evolve) {
                const evoLevels = Object.keys(currentCharObj.evolve).map(Number).sort((a, b) => b - a);
                for (let evoLv of evoLevels) {
                    if (level >= evoLv) {
                        currentImg = currentCharObj.evolve[evoLv];
                        break; 
                    }
                }
            }
            displayImg.src = currentImg;
            displayImg.onerror = function() {
                this.src = `https://via.placeholder.com/300?text=${currentCharObj.name}`;
            };
        }

        function resetLevel() {
            if (!currentCharObj) { alert("캐릭터를 선택해주세요!"); return; }
            if (confirm(`[${currentCharObj.name}]을 초기화할까요?`)) {
                level = 1; currentExp = 0; currentMaxExp = 100;
                localStorage.setItem('arch_clicker_' + currentCharObj.name, JSON.stringify({ level, exp: currentExp, maxExp: currentMaxExp }));
                updateUI(); updateCharacterImage();
                alert("초기화되었습니다.");
            }
        }

        function triggerEvoEffect() {
            const effectDiv = document.getElementById('evolution-effect');
            effectDiv.classList.add('evo-active');
            setTimeout(() => effectDiv.classList.remove('evo-active'), 2500);
        }

        // 모바일 터치 이벤트 대응
        displayImg.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 기본 동작(줌) 방지
            handleMainClick();
        }, {passive: false});

        // PC 클릭 대응
        displayImg.addEventListener('mousedown', (e) => {
            handleMainClick();
        });

        function handleMainClick() {
            if(!currentCharObj) { toggleSidebar(); return; }
            
            // 사운드 재생
            const audio = new Audio(soundMap[selectedSound]);
            audio.play().catch(()=>{});
            
            currentExp += 20; 
            if(currentExp >= currentMaxExp) {
                level++;
                currentExp -= currentMaxExp;
                currentMaxExp = Math.floor(currentMaxExp * 1.2);
                updateCharacterImage();
                if(level === 50 || level === 100) triggerEvoEffect();
                
                lvDisplay.style.transform = "scale(1.3)";
                setTimeout(() => lvDisplay.style.transform = "scale(1)", 150);
            }
            
            localStorage.setItem('arch_clicker_' + currentCharObj.name, JSON.stringify({ level, exp: currentExp, maxExp: currentMaxExp }));
            updateUI();
        }

        function updateUI() {
            lvDisplay.innerText = `LV. ${level}`;
            expText.innerText = Math.floor(currentExp);
            maxExpText.innerText = currentMaxExp;
            gauge.style.width = Math.min((currentExp / currentMaxExp) * 100, 100) + "%";
        }
    </script>
</body>
</html>
